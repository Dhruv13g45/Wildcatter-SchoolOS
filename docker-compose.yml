services:
  db:
    image: postgres:15-alpine
    container_name: schoolos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: schoolos
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_pass
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data   # persist data between restarts
volumes:
  db-data: